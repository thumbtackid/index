            posConfirmAddPart() {
                const sel = document.getElementById('modal-part-select');
                const qty = parseInt(document.getElementById('modal-part-qty').value) || 1;
                const price = parseFloat(document.getElementById('modal-part-price').value) || 0;
                const part = DB.getParts().find(p => p.id === sel.value);
                if (!part) { UI.toast('Pilih sparepart yang valid', 'error'); return; }
                if (qty <= 0) { UI.toast('Qty harus lebih dari 0', 'error'); return; }
                if (qty > part.stock) { UI.toast('Stok tidak mencukupi! Tersedia: ' + part.stock, 'error'); return; }
                if (price <= 0) { UI.toast('Harga harus lebih dari 0', 'error'); return; }

                AppState.pos.parts.push({
                    partId: part.id,
                    name: part.name,
                    cost: part.cost,
                    price: price,
                    qty: qty
                });
                App.closeModal();
                Views.pos();
                UI.toast('Sparepart ditambahkan: ' + part.name + ' x' + qty);
            },

            posRemovePart(index) {
                AppState.pos.parts.splice(index, 1);
                Views.pos();
            },

            posSaveTransaction() {
                const state = AppState.pos;
                // Validasi
                if (!state.customerName.trim()) { UI.toast('Nama pelanggan wajib diisi', 'error'); return; }
                if (!state.issue.trim()) { UI.toast('Keluhan wajib diisi', 'error'); return; }
                if (state.services.length === 0 && state.parts.length === 0) {
                    UI.toast('Tambahkan minimal 1 jasa atau sparepart', 'error');
                    return;
                }

                const totalJasa = state.services.reduce((s, i) => s + i.price, 0);
                const totalPart = state.parts.reduce((s, i) => s + (i.price * i.qty), 0);
                const totalCostPart = state.parts.reduce((s, i) => s + (i.cost * i.qty), 0);
                const subtotal = totalJasa + totalPart;
                const discount = state.discount || 0;
                const grandTotal = subtotal - discount;
                if (grandTotal <= 0) { UI.toast('Total harus lebih dari 0', 'error'); return; }
                const dp = state.dp || 0;
                if (dp > grandTotal) { UI.toast('DP tidak boleh lebih dari total', 'error'); return; }

                // Generate WO
                const wo = DB.generateWO();

                // Get technician name
                const tech = DB.getTechnicians().find(t => t.id === state.technicianId);

                // Create transaction
                const tx = {
                    wo: wo,
                    date: new Date().toISOString(),
                    customerName: state.customerName,
                    customerWA: state.customerWA,
                    customerAddress: state.customerAddress,
                    customerId: state.customerId || null,
                    deviceCategory: state.deviceCategory,
                    deviceBrand: state.deviceBrand,
                    deviceModel: state.deviceModel,
                    deviceSerial: state.deviceSerial,
                    deviceAccessories: state.deviceAccessories,
                    deviceCondition: state.deviceCondition,
                    issue: state.issue,
                    diagnosis: state.diagnosis,
                    services: state.services.map(s => ({ ...s })),
                    parts: state.parts.map(p => ({ ...p })),
                    discount: discount,
                    total: grandTotal,
                    dp: dp,
                    status: state.status,
                    technicianId: state.technicianId || null,
                    technician: tech ? tech.name : '',
                    notes: state.notes,
                    warranty: state.warranty || 0,
                };

                // Deduct stock
                const partsDb = DB.getParts();
                state.parts.forEach(sp => {
                    const idx = partsDb.findIndex(p => p.id === sp.partId);
                    if (idx !== -1) {
                        partsDb[idx].stock = Math.max(0, partsDb[idx].stock - sp.qty);
                    }
                });
                DB.setParts(partsDb);

                // Update customer service count
                let customers = DB.getCustomers();
                if (state.customerId) {
                    const cIdx = customers.findIndex(c => c.id === state.customerId);
                    if (cIdx !== -1) {
                        customers[cIdx].serviceCount = (customers[cIdx].serviceCount || 0) + 1;
                        customers[cIdx].lastService = tx.date;
                        customers[cIdx].totalSpent = (customers[cIdx].totalSpent || 0) + grandTotal;
                    }
                } else {
                    // Create new customer
                    const newCust = {
                        id: Utils.generateId('CUST'),
                        name: state.customerName,
                        phone: state.customerWA,
                        address: state.customerAddress,
                        serviceCount: 1,
                        totalSpent: grandTotal,
                        lastService: tx.date
                    };
                    customers.push(newCust);
                    tx.customerId = newCust.id;
                }
                DB.setCustomers(customers);

                // Save transaction
                const txs = DB.getTransactions();
                txs.push(tx);
                DB.setTransactions(txs);

                // Update technician stats
                if (state.technicianId) {
                    const techs = DB.getTechnicians();
                    const tIdx = techs.findIndex(t => t.id === state.technicianId);
                    if (tIdx !== -1) {
                        techs[tIdx].servicesCount = (techs[tIdx].servicesCount || 0) + 1;
                        techs[tIdx].totalJasa = (techs[tIdx].totalJasa || 0) + totalJasa;
                        DB.setTechnicians(techs);
                    }
                }

                UI.toast('Servis ' + wo + ' berhasil dibuat!');
                // Reset POS state
                AppState.pos = {
                    customerId: null,
                    customerName: '',
                    customerWA: '',
                    customerAddress: '',
                    deviceCategory: 'Laptop',
                    deviceBrand: '',
                    deviceModel: '',
                    deviceSerial: '',
                    deviceAccessories: '',
                    deviceCondition: '',
                    issue: '',
                    diagnosis: '',
                    services: [],
                    parts: [],
                    discount: 0,
                    dp: 0,
                    status: 'Menunggu pemeriksaan',
                    technicianId: '',
                    notes: '',
                    warranty: 7,
                };
                AppState.editingTxId = null;
                App.navigate('history');
                // Show receipt after a moment
                setTimeout(() => UI.showReceipt(wo), 500);
            },

            // --- Edit transaction ---
            editTransaction(wo) {
                const tx = DB.getTransactions().find(t => t.wo === wo);
                if (!tx) { UI.toast('Transaksi tidak ditemukan', 'error'); return; }

                AppState.editingTxId = wo;
                AppState.pos = {
                    customerId: tx.customerId || null,
                    customerName: tx.customerName || '',
                    customerWA: tx.customerWA || '',
                    customerAddress: tx.customerAddress || '',
                    deviceCategory: tx.deviceCategory || 'Laptop',
                    deviceBrand: tx.deviceBrand || '',
                    deviceModel: tx.deviceModel || '',
                    deviceSerial: tx.deviceSerial || '',
                    deviceAccessories: tx.deviceAccessories || '',
                    deviceCondition: tx.deviceCondition || '',
                    issue: tx.issue || '',
                    diagnosis: tx.diagnosis || '',
                    services: (tx.services || []).map(s => ({ ...s })),
                    parts: (tx.parts || []).map(p => ({ ...p })),
                    discount: tx.discount || 0,
                    dp: tx.dp || 0,
                    status: tx.status || 'Menunggu pemeriksaan',
                    technicianId: tx.technicianId || '',
                    notes: tx.notes || '',
                    warranty: tx.warranty || 0,
                };
                App.navigate('pos');
                UI.toast('Edit mode: ' + wo);
            },

            posUpdateTransaction() {
                const state = AppState.pos;
                const wo = AppState.editingTxId;
                if (!wo) { UI.toast('Tidak ada transaksi diedit', 'error'); return; }

                const txs = DB.getTransactions();
                const idx = txs.findIndex(t => t.wo === wo);
                if (idx === -1) { UI.toast('Transaksi tidak ditemukan', 'error'); return; }

                const totalJasa = state.services.reduce((s, i) => s + i.price, 0);
                const totalPart = state.parts.reduce((s, i) => s + (i.price * i.qty), 0);
                const totalCostPart = state.parts.reduce((s, i) => s + (i.cost * i.qty), 0);
                const subtotal = totalJasa + totalPart;
                const discount = state.discount || 0;
                const grandTotal = subtotal - discount;
                if (grandTotal <= 0) { UI.toast('Total harus lebih dari 0', 'error'); return; }

                const tech = DB.getTechnicians().find(t => t.id === state.technicianId);

                txs[idx] = {
                    ...txs[idx],
                    customerName: state.customerName,
                    customerWA: state.customerWA,
                    customerAddress: state.customerAddress,
                    deviceCategory: state.deviceCategory,
                    deviceBrand: state.deviceBrand,
                    deviceModel: state.deviceModel,
                    deviceSerial: state.deviceSerial,
                    deviceAccessories: state.deviceAccessories,
                    deviceCondition: state.deviceCondition,
                    issue: state.issue,
                    diagnosis: state.diagnosis,
                    services: state.services.map(s => ({ ...s })),
                    parts: state.parts.map(p => ({ ...p })),
                    discount: discount,
                    total: grandTotal,
                    dp: state.dp || 0,
                    status: state.status,
                    technicianId: state.technicianId || null,
                    technician: tech ? tech.name : '',
                    notes: state.notes,
                    warranty: state.warranty || 0,
                };

                DB.setTransactions(txs);
                UI.toast('Servis ' + wo + ' berhasil diupdate!');
                AppState.editingTxId = null;
                App.navigate('history');
                // Show updated receipt
                setTimeout(() => UI.showReceipt(wo), 500);
            },

            posCancelEdit() {
                AppState.editingTxId = null;
                AppState.pos = {
                    customerId: null,
                    customerName: '',
                    customerWA: '',
                    customerAddress: '',
                    deviceCategory: 'Laptop',
                    deviceBrand: '',
                    deviceModel: '',
                    deviceSerial: '',
                    deviceAccessories: '',
                    deviceCondition: '',
                    issue: '',
                    diagnosis: '',
                    services: [],
                    parts: [],
                    discount: 0,
                    dp: 0,
                    status: 'Menunggu pemeriksaan',
                    technicianId: '',
                    notes: '',
                    warranty: 7,
                };
                App.navigate('pos');
                UI.toast('Edit dibatalkan');
            },

            // ============================================================
            //  HISTORY / SEARCH
            // ============================================================
            searchHistory(query) {
                const txs = window._historyData || DB.getTransactions().reverse();
                const filtered = Utils.filterList(txs, query, ['wo', 'customerName', 'deviceCategory', 'deviceBrand',
                    'status'
                ]);
                document.getElementById('history-tbody').innerHTML = Views._historyRows(filtered);
            },

            filterHistory(status) {
                document.querySelectorAll('#history-filters .filter-chip').forEach(el => {
                    el.classList.toggle('active', el.textContent === status);
                });
                const txs = window._historyData || DB.getTransactions().reverse();
                const filtered = status === 'Semua' ? txs : txs.filter(t => t.status === status);
                document.getElementById('history-tbody').innerHTML = Views._historyRows(filtered);
            },

            viewReceipt(wo) { UI.showReceipt(wo); },
            shareWA(wo) { UI.shareWA(wo); },
            printReceipt(mode) { UI.printReceipt(mode); },

            // ============================================================
            //  CUSTOMERS
            // ============================================================
            customerAdd() {
                const html = `
                    <div class="form-group"><label>Nama <span class="required">*</span></label>
                        <input class="form-control" id="cust-name" placeholder="Nama pelanggan..."></div>
                    <div class="form-group"><label>WhatsApp</label>
                        <input class="form-control" id="cust-phone" placeholder="08..."></div>
                    <div class="form-group"><label>Alamat</label>
                        <input class="form-control" id="cust-addr" placeholder="Alamat..."></div>
                `;
                const footer = `
                    <button class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                    <button class="btn btn-primary" onclick="App.customerSave()">Simpan</button>
                `;
                UI.openModal('Tambah Pelanggan', html, footer);
            },

            customerSave() {
                const name = document.getElementById('cust-name').value.trim();
                if (!name) { UI.toast('Nama pelanggan wajib diisi', 'error'); return; }
                const customers = DB.getCustomers();
                customers.push({
                    id: Utils.generateId('CUST'),
                    name: name,
                    phone: document.getElementById('cust-phone').value.trim(),
                    address: document.getElementById('cust-addr').value.trim(),
                    serviceCount: 0,
                    totalSpent: 0,
                    lastService: null
                });
                DB.setCustomers(customers);
                UI.toast('Pelanggan berhasil ditambahkan');
                App.closeModal();
                Views.customers();
            },

            searchCustomers(query) {
                const customers = DB.getCustomers();
                const filtered = Utils.filterList(customers, query, ['name', 'phone', 'address']);
                const tbody = document.getElementById('customers-tbody');
                if (tbody) {
                    tbody.innerHTML = filtered.map(c => `
                        <tr>
                            <td><strong>${c.name}</strong></td>
                            <td>${c.phone || '-'}</td>
                            <td>${c.address || '-'}</td>
                            <td>${c.serviceCount || 0}</td>
                            <td>
                                <button class="btn btn-sm btn-outline" onclick="App.viewCustomer('${c.id}')"><i class="fas fa-eye"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="App.deleteCustomer('${c.id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `).join('') || '<tr><td colspan="5" class="text-center text-muted" style="padding:1.5rem;">Tidak ditemukan</td></tr>';
                }
            },

            viewCustomer(id) {
                const cust = DB.getCustomers().find(c => c.id === id);
                if (!cust) { UI.toast('Pelanggan tidak ditemukan', 'error'); return; }
                const txs = DB.getTransactions().filter(t => t.customerId === id || t.customerName === cust.name);
                let historyHtml = txs.length === 0 ? '<p class="text-muted">Belum ada servis</p>' :
                    txs.map(t =>
                        `<div class="flex justify-between items-center border-bottom" style="padding:0.3rem 0;">
                            <span><strong>${t.wo}</strong> - ${t.deviceCategory} ${t.deviceBrand || ''}</span>
                            <span>${Utils.rupiah(t.total)} <span class="badge ${t.status === 'Selesai' || t.status === 'Sudah diambil' ? 'badge-success' : 'badge-warning'}">${t.status}</span></span>
                        </div>`
                    ).join('');
                const html = `
                    <div><strong>Nama:</strong> ${cust.name}</div>
                    <div><strong>WA:</strong> ${cust.phone || '-'}</div>
                    <div><strong>Alamat:</strong> ${cust.address || '-'}</div>
                    <div><strong>Total Servis:</strong> ${cust.serviceCount || 0}</div>
                    <div><strong>Total Belanja:</strong> ${Utils.rupiah(cust.totalSpent || 0)}</div>
                    <div class="divider"></div>
                    <div><strong>Riwayat Servis:</strong></div>
                    ${historyHtml}
                `;
                UI.openModal('Detail Pelanggan', html, '');
            },

            deleteCustomer(id) {
                if (!confirm('Hapus pelanggan ini?')) return;
                let customers = DB.getCustomers();
                customers = customers.filter(c => c.id !== id);
                DB.setCustomers(customers);
                UI.toast('Pelanggan dihapus');
                Views.customers();
            },

            // ============================================================
            //  INVENTORY
            // ============================================================
            invAdd() {
                const html = `
                    <div class="form-row">
                        <div class="form-group"><label>Nama Sparepart <span class="required">*</span></label>
                            <input class="form-control" id="inv-name" placeholder="Nama..."></div>
                        <div class="form-group"><label>Kategori</label>
                            <input class="form-control" id="inv-cat" placeholder="Kategori..."></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Merk</label>
                            <input class="form-control" id="inv-brand" placeholder="Merk..."></div>
                        <div class="form-group"><label>Model</label>
                            <input class="form-control" id="inv-model" placeholder="Model..."></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Harga Modal (Rp)</label>
                            <input class="form-control" type="number" id="inv-cost" value="0"></div>
                        <div class="form-group"><label>Harga Jual (Rp)</label>
                            <input class="form-control" type="number" id="inv-price" value="0"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Stok</label>
                            <input class="form-control" type="number" id="inv-stock" value="1"></div>
                        <div class="form-group"><label>Min Stok</label>
                            <input class="form-control" type="number" id="inv-min" value="1"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Supplier</label>
                            <input class="form-control" id="inv-supplier" placeholder="Supplier..."></div>
                        <div class="form-group"><label>Lokasi</label>
                            <input class="form-control" id="inv-location" placeholder="Rak..."></div>
                    </div>
                `;
                const footer = `
                    <button class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                    <button class="btn btn-primary" onclick="App.invSave()">Simpan</button>
                `;
                UI.openModal('Tambah Sparepart', html, footer);
            },

            invSave(editId) {
                const name = document.getElementById('inv-name').value.trim();
                if (!name) { UI.toast('Nama sparepart wajib diisi', 'error'); return; }
                const cost = parseFloat(document.getElementById('inv-cost').value) || 0;
                const price = parseFloat(document.getElementById('inv-price').value) || 0;
                if (price <= 0) { UI.toast('Harga jual harus lebih dari 0', 'error'); return; }

                const parts = DB.getParts();
                const data = {
                    id: editId || Utils.generateId('P'),
                    name: name,
                    category: document.getElementById('inv-cat').value.trim(),
                    brand: document.getElementById('inv-brand').value.trim(),
                    model: document.getElementById('inv-model').value.trim(),
                    cost: cost,
                    price: price,
                    stock: parseInt(document.getElementById('inv-stock').value) || 0,
                    minStock: parseInt(document.getElementById('inv-min').value) || 1,
                    supplier: document.getElementById('inv-supplier').value.trim(),
                    location: document.getElementById('inv-location').value.trim(),
                };

                if (editId) {
                    const idx = parts.findIndex(p => p.id === editId);
                    if (idx !== -1) parts[idx] = { ...parts[idx], ...data };
                } else {
                    parts.push(data);
                }
                DB.setParts(parts);
                UI.toast(editId ? 'Sparepart diupdate' : 'Sparepart ditambahkan');
                App.closeModal();
                Views.inventory();
            },

            invEdit(id) {
                const p = DB.getParts().find(x => x.id === id);
                if (!p) { UI.toast('Sparepart tidak ditemukan', 'error'); return; }
                const html = `
                    <div class="form-row">
                        <div class="form-group"><label>Nama Sparepart <span class="required">*</span></label>
                            <input class="form-control" id="inv-name" value="${p.name}"></div>
                        <div class="form-group"><label>Kategori</label>
                            <input class="form-control" id="inv-cat" value="${p.category || ''}"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Merk</label>
                            <input class="form-control" id="inv-brand" value="${p.brand || ''}"></div>
                        <div class="form-group"><label>Model</label>
                            <input class="form-control" id="inv-model" value="${p.model || ''}"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Harga Modal (Rp)</label>
                            <input class="form-control" type="number" id="inv-cost" value="${p.cost || 0}"></div>
                        <div class="form-group"><label>Harga Jual (Rp)</label>
                            <input class="form-control" type="number" id="inv-price" value="${p.price || 0}"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Stok</label>
                            <input class="form-control" type="number" id="inv-stock" value="${p.stock || 0}"></div>
                        <div class="form-group"><label>Min Stok</label>
                            <input class="form-control" type="number" id="inv-min" value="${p.minStock || 1}"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Supplier</label>
                            <input class="form-control" id="inv-supplier" value="${p.supplier || ''}"></div>
                        <div class="form-group"><label>Lokasi</label>
                            <input class="form-control" id="inv-location" value="${p.location || ''}"></div>
                    </div>
                `;
                const footer = `
                    <button class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                    <button class="btn btn-primary" onclick="App.invSave('${id}')">Update</button>
                `;
                UI.openModal('Edit Sparepart', html, footer);
            },

            invDelete(id) {
                if (!confirm('Hapus sparepart ini?')) return;
                let parts = DB.getParts();
                parts = parts.filter(p => p.id !== id);
                DB.setParts(parts);
                UI.toast('Sparepart dihapus');
                Views.inventory();
            },

            searchParts(query) {
                const parts = DB.getParts();
                const filtered = Utils.filterList(parts, query, ['name', 'category', 'brand', 'id']);
                const tbody = document.getElementById('inventory-tbody');
                if (tbody) {
                    tbody.innerHTML = filtered.map(p => `
                        <tr>
                            <td>${p.id}</td>
                            <td><strong>${p.name}</strong></td>
                            <td>${p.category}</td>
                            <td>${Utils.rupiah(p.cost)}</td>
                            <td>${Utils.rupiah(p.price)}</td>
                            <td>
                                <span class="badge ${p.stock <= p.minStock ? 'badge-danger' : p.stock <= p.minStock * 2 ? 'badge-warning' : 'badge-success'}">
                                    ${p.stock}
                                    ${p.stock <= p.minStock ? '⚠️' : ''}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline" onclick="App.invEdit('${p.id}')"><i class="fas fa-pen"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="App.invDelete('${p.id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `).join('') || '<tr><td colspan="7" class="text-center text-muted" style="padding:1.5rem;">Tidak ditemukan</td></tr>';
                }
            },

            // ============================================================
            //  TECHNICIANS
            // ============================================================
            techAdd() {
                const html = `
                    <div class="form-group"><label>Nama Teknisi <span class="required">*</span></label>
                        <input class="form-control" id="tech-name" placeholder="Nama..."></div>
                    <div class="form-group"><label>Nomor HP</label>
                        <input class="form-control" id="tech-phone" placeholder="08..."></div>
                    <div class="form-group"><label>Keahlian (pisah koma)</label>
                        <input class="form-control" id="tech-skills" placeholder="Laptop, HP, AC..."></div>
                    <div class="form-group"><label>Status</label>
                        <select class="form-control" id="tech-active">
                            <option value="1">Aktif</option>
                            <option value="0">Nonaktif</option>
                        </select>
                    </div>
                `;
                const footer = `
                    <button class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                    <button class="btn btn-primary" onclick="App.techSave()">Simpan</button>
                `;
                UI.openModal('Tambah Teknisi', html, footer);
            },

            techSave(editId) {
                const name = document.getElementById('tech-name').value.trim();
                if (!name) { UI.toast('Nama teknisi wajib diisi', 'error'); return; }
                const techs = DB.getTechnicians();
                const data = {
                    id: editId || Utils.generateId('T'),
                    name: name,
                    phone: document.getElementById('tech-phone').value.trim(),
                    skills: document.getElementById('tech-skills').value.split(',').map(s => s.trim()).filter(Boolean),
                    active: document.getElementById('tech-active').value === '1',
                    servicesCount: 0,
                    totalJasa: 0,
                };
                if (editId) {
                    const idx = techs.findIndex(t => t.id === editId);
                    if (idx !== -1) techs[idx] = { ...techs[idx], ...data };
                } else {
                    techs.push(data);
                }
                DB.setTechnicians(techs);
                UI.toast(editId ? 'Teknisi diupdate' : 'Teknisi ditambahkan');
                App.closeModal();
                Views.technicians();
            },

            techEdit(id) {
                const t = DB.getTechnicians().find(x => x.id === id);
                if (!t) { UI.toast('Teknisi tidak ditemukan', 'error'); return; }
                const html = `
                    <div class="form-group"><label>Nama Teknisi <span class="required">*</span></label>
                        <input class="form-control" id="tech-name" value="${t.name}"></div>
                    <div class="form-group"><label>Nomor HP</label>
                        <input class="form-control" id="tech-phone" value="${t.phone || ''}"></div>
                    <div class="form-group"><label>Keahlian (pisah koma)</label>
                        <input class="form-control" id="tech-skills" value="${(t.skills || []).join(', ')}"></div>
                    <div class="form-group"><label>Status</label>
                        <select class="form-control" id="tech-active">
                            <option value="1" ${t.active ? 'selected' : ''}>Aktif</option>
                            <option value="0" ${!t.active ? 'selected' : ''}>Nonaktif</option>
                        </select>
                    </div>
                `;
                const footer = `
                    <button class="btn btn-outline" onclick="App.closeModal()">Batal</button>
                    <button class="btn btn-primary" onclick="App.techSave('${id}')">Update</button>
                `;
                UI.openModal('Edit Teknisi', html, footer);
            },

            techDelete(id) {
                if (!confirm('Hapus teknisi ini?')) return;
                let techs = DB.getTechnicians();
                techs = techs.filter(t => t.id !== id);
                DB.setTechnicians(techs);
                UI.toast('Teknisi dihapus');
                Views.technicians();
            },

            // ============================================================
            //  SETTINGS
            // ============================================================
            saveSettings(e) {
                e.preventDefault();
                const form = e.target;
                const data = {
                    shopName: form.shopName.value,
                    phone: form.phone.value,
                    address: form.address.value,
                    tagline: form.tagline.value,
                    receiptFooter: form.receiptFooter.value,
                    defaultWarranty: parseInt(form.defaultWarranty.value) || 7,
                    woFormat: form.woFormat.value || 'MS-{date}-{seq}',
                };
                DB.setSettings(data);
                UI.updateHeader();
                UI.toast('Pengaturan disimpan!');
            },

            // ============================================================
            //  BACKUP / RESTORE / RESET
            // ============================================================
            exportData() {
                const data = {
                    customers: DB.getCustomers(),
                    services: DB.getServices(),
                    serviceItems: DB.getServiceItems(),
                    parts: DB.getParts(),
                    technicians: DB.getTechnicians(),
                    suppliers: DB.getSuppliers(),
                    transactions: DB.getTransactions(),
                    settings: DB.getSettings(),
                    exportedAt: new Date().toISOString(),
                    version: '2.0'
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `malik-servis-backup-${Utils.todayStr()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                UI.toast('Data berhasil diekspor!');
            },

            importData() {
                const fileInput = document.getElementById('restore-file');
                if (!fileInput.files || fileInput.files.length === 0) {
                    UI.toast('Pilih file JSON terlebih dahulu', 'warning');
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.customers || !data.transactions) {
                            UI.toast('Format file tidak valid', 'error');
                            return;
                        }
                        if (!confirm('Restore akan mengganti semua data saat ini. Lanjutkan?')) return;
                        DB.setCustomers(data.customers || []);
                        DB.setServices(data.services || []);
                        DB.setServiceItems(data.serviceItems || []);
                        DB.setParts(data.parts || []);
                        DB.setTechnicians(data.technicians || []);
                        DB.setSuppliers(data.suppliers || []);
                        DB.setTransactions(data.transactions || []);
                        if (data.settings) DB.setSettings(data.settings);
                        UI.toast('Data berhasil direstore!');
                        App.navigate('dashboard');
                    } catch (err) {
                        UI.toast('Gagal membaca file: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            },

            resetAllData() {
                if (!confirm('⚠️ PERINGATAN: Ini akan menghapus SEMUA data. Lanjutkan?')) return;
                if (!confirm('KONFIRMASI KEDUA: Yakin ingin reset semua data?')) return;
                // Clear all
                localStorage.clear();
                DB.init();
                UI.toast('Semua data telah direset!');
                window.location.reload();
            }
        };

        // ============================================================
        //  7. BOOTSTRAP
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });

        // Expose App globally
        window.App = App;
        window.UI = UI;
        window.Utils = Utils;
        window.DB = DB;
        window.Views = Views;
    </script>
</body>
</html>
