        // ================================================================
        const UI = {
            openModal(title, bodyHTML, footerHTML = '') {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-body').innerHTML = bodyHTML;
                document.getElementById('modal-footer').innerHTML = footerHTML;
                document.getElementById('app-modal').classList.add('open');
            },
            closeModal() { document.getElementById('app-modal').classList.remove('open'); },
            toast(msg, type) { Utils.toast(msg, type); },
            updateHeader() {
                const settings = DB.getSettings();
                document.getElementById('ui-shop-name').textContent = settings.shopName || 'Malik Servis';
                const now = new Date();
                document.getElementById('header-date').textContent = now.toLocaleDateString('id-ID', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            },
            navigate(view) {
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                const target = document.getElementById('view-' + view);
                if (target) target.classList.remove('hidden');
                document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.view === view);
                });
                const titles = {
                    dashboard: 'Dashboard',
                    pos: 'Transaksi Baru',
                    history: 'Data Servis',
                    customers: 'Pelanggan',
                    reports: 'Laporan',
                    settings: 'Pengaturan',
                    backup: 'Backup & Restore'
                };
                document.getElementById('page-title-text').textContent = titles[view] || view;
                document.getElementById('page-sub').textContent = '';
                AppState.currentView = view;
                switch (view) {
                    case 'dashboard':
                        Views.dashboard();
                        break;
                    case 'pos':
                        Views.pos();
                        break;
                    case 'history':
                        Views.history();
                        break;
                    case 'customers':
                        Views.customers();
                        break;
                    case 'reports':
                        Views.reports();
                        break;
                    case 'settings':
                        Views.settings();
                        break;
                    case 'backup':
                        Views.backup();
                        break;
                }
                if (window.innerWidth <= 768) App.toggleSidebar(false);
            },

            renderPOSItems() {
                const state = AppState.pos;
                const list = document.getElementById('pos-selected-list');
                if (list) {
                    if (state.services.length === 0) {
                        list.innerHTML =
                            `<div class="empty-state"><i class="fas fa-cart-plus"></i> Belum ada layanan dipilih</div>`;
                    } else {
                        list.innerHTML = state.services.map((s, i) => `
                            <div class="item-row">
                                <div class="item-info">
                                    <div class="name">${s.name}</div>
                                    <div class="sub">${s.category}</div>
                                </div>
                                <div class="item-actions">
                                    <span class="price-tag">${Utils.rupiah(s.price)}</span>
                                    <button class="btn btn-sm btn-danger" onclick="App.posRemoveService(${i})"><i class="fas fa-times"></i></button>
                                </div>
                            </div>
                        `).join('');
                    }
                }
                this.updatePOSSummary();
            },

            updatePOSSummary() {
                const state = AppState.pos;
                const total = state.services.reduce((s, i) => s + i.price, 0);
                const discount = state.discount || 0;
                const grandTotal = total - discount;
                const el = (id) => document.getElementById(id);
                el('pos-sum-total') && (el('pos-sum-total').textContent = Utils.rupiah(total));
                el('pos-sum-discount') && (el('pos-sum-discount').textContent = Utils.rupiah(discount));
                el('pos-sum-grand') && (el('pos-sum-grand').textContent = Utils.rupiah(grandTotal));
                const dp = state.dp || 0;
                const sisa = grandTotal - dp;
                el('pos-sum-sisa') && (el('pos-sum-sisa').textContent = Utils.rupiah(sisa > 0 ? sisa : 0));
                el('pos-count') && (el('pos-count').textContent = state.services.length + ' item');
            },

            showReceipt(txId) {
                const tx = DB.getTransactions().find(t => t.wo === txId);
                if (!tx) { this.toast('Transaksi tidak ditemukan', 'error'); return; }
                const settings = DB.getSettings();
                let detailHtml = '';
                if (tx.services && tx.services.length) {
                    tx.services.forEach(s => {
                        detailHtml +=
                            `<div class="flex-between"><span>${s.name}</span><span>${Utils.rupiah(s.price)}</span></div>`;
                    });
                }
                const isLunas = (tx.dp || 0) >= tx.total;
                const thermal = `
                    <div class="thermal-print">
                        <div class="text-center"><strong>${settings.shopName.toUpperCase()}</strong></div>
                        <div class="text-center text-sm">${settings.tagline || ''}</div>
                        <div class="text-center text-sm">WA: ${settings.phone || ''}</div>
                        <div class="divider"></div>
                        <div><strong>No WO:</strong> ${tx.wo}</div>
                        <div><strong>Tanggal:</strong> ${Utils.formatDate(tx.date)}</div>
                        <div><strong>Pelanggan:</strong> ${tx.customerName}</div>
                        ${tx.customerWA ? `<div><strong>WA:</strong> ${tx.customerWA}</div>` : ''}
                        <div class="divider"></div>
                        ${detailHtml}
                        ${tx.discount > 0 ? `<div class="flex-between"><span>Diskon</span><span>-${Utils.rupiah(tx.discount)}</span></div>` : ''}
                        <div class="divider-dot"></div>
                        <div class="flex-between" style="font-weight:700;font-size:1.1em;"><span>TOTAL</span><span>${Utils.rupiah(tx.total)}</span></div>
                        <div class="flex-between"><span>DP / Bayar</span><span>${Utils.rupiah(tx.dp || 0)}</span></div>
                        <div class="flex-between"><strong>SISA</strong><strong>${Utils.rupiah(Math.max(0, tx.total - (tx.dp || 0)))}</strong></div>
                        <div class="flex-between"><span>Status</span><span>${isLunas ? '✅ LUNAS' : '⏳ BELUM LUNAS'}</span></div>
                        <div class="divider"></div>
                        <div><strong>Status Servis:</strong> ${tx.status}</div>
                        ${tx.technician ? `<div><strong>Teknisi:</strong> ${tx.technician}</div>` : ''}
                        ${tx.warranty ? `<div><strong>Garansi:</strong> ${tx.warranty} hari</div>` : ''}
                        <div class="divider"></div>
                        <div class="text-center text-sm" style="white-space:pre-line;">${settings.receiptFooter || ''}</div>
                        <div class="text-center text-xs mt-1">${tx.wo} • ${Utils.formatDateShort(tx.date)}</div>
                    </div>
                `;
                const a4 = `
                    <div class="a4-print">
                        <div class="header">
                            <h1>${settings.shopName}</h1>
                            <p>${settings.tagline || ''} • WA: ${settings.phone || ''}</p>
                            <p style="font-size:12px;color:#64748b;">${settings.address || ''}</p>
                        </div>
                        <div class="grid-2">
                            <div><p><strong>No WO:</strong> ${tx.wo}</p><p><strong>Tanggal:</strong> ${Utils.formatDate(tx.date)}</p><p><strong>Pelanggan:</strong> ${tx.customerName}</p>${tx.customerWA ? `<p><strong>WA:</strong> ${tx.customerWA}</p>` : ''}</div>
                            <div><p><strong>Status:</strong> ${tx.status}</p>${tx.technician ? `<p><strong>Teknisi:</strong> ${tx.technician}</p>` : ''}${tx.warranty ? `<p><strong>Garansi:</strong> ${tx.warranty} hari</p>` : ''}</div>
                        </div>
                        <table class="table">
                            <thead><tr><th>Layanan</th><th style="text-align:right;">Harga</th></tr></thead>
                            <tbody>
                                ${(tx.services || []).map(s => `<tr><td>${s.name}</td><td style="text-align:right;">${Utils.rupiah(s.price)}</td></tr>`).join('')}
                            </tbody>
                        </table>
                        <div class="total-box" style="text-align:right;">
                            ${tx.discount > 0 ? `<div class="row"><span>Diskon</span><span>-${Utils.rupiah(tx.discount)}</span></div>` : ''}
                            <div style="font-size:1.3rem;font-weight:700;">Total: ${Utils.rupiah(tx.total)}</div>
                            <div>DP: ${Utils.rupiah(tx.dp || 0)}</div>
                            <div style="font-weight:600;">Sisa: ${Utils.rupiah(Math.max(0, tx.total - (tx.dp || 0)))}</div>
                            <div style="margin-top:4px;font-weight:600;color:${isLunas ? 'var(--success)' : 'var(--danger)'};">${isLunas ? '✅ LUNAS' : '⏳ BELUM LUNAS'}</div>
                        </div>
                        <div class="footer">${settings.receiptFooter || ''}</div>
                    </div>
                `;
                document.getElementById('print-area').innerHTML = thermal;
                const bodyHTML = `
                    <div style="display:flex;flex-direction:column;gap:1rem;">
                        <div class="receipt-preview">${thermal}</div>
                        <details>
                            <summary style="cursor:pointer;font-weight:600;font-size:0.85rem;color:var(--gray-600);">📄 Lihat versi A4</summary>
                            <div style="margin-top:0.5rem;background:#fff;padding:0.5rem;border:1px solid var(--gray-200);border-radius:8px;max-height:400px;overflow-y:auto;">${a4}</div>
                        </details>
                    </div>
                `;
                const footerHTML = `
                    <button class="btn btn-outline" onclick="App.closeModal()">Tutup</button>
                    ${tx.customerWA ? `<button class="btn btn-success" onclick="App.shareWA('${tx.wo}')"><i class="fab fa-whatsapp"></i> WA</button>` : ''}
                    <button class="btn btn-primary" onclick="App.printReceipt('thermal')"><i class="fas fa-print"></i> Thermal</button>
                    <button class="btn btn-primary" onclick="App.printReceipt('a4')"><i class="fas fa-file-pdf"></i> A4</button>
                `;
                UI.openModal('Nota Servis — ' + tx.wo, bodyHTML, footerHTML);
            },

            printReceipt(mode) {
                const el = document.getElementById('print-area');
                if (mode === 'a4') {
                    const a4El = el.querySelector('.a4-print');
                    if (a4El) {
                        const printWin = window.open('', '_blank', 'width=800,height=600');
                        printWin.document.write(
                            `<html><head><title>Nota A4</title><style>${document.querySelector('style').innerHTML}</style></head><body>${a4El.outerHTML}</body></html>`
                            );
                        printWin.document.close();
                        printWin.focus();
                        printWin.print();
                    }
                } else {
                    const thermalEl = el.querySelector('.thermal-print');
                    if (thermalEl) {
                        const printWin = window.open('', '_blank', 'width=400,height=600');
                        printWin.document.write(
                            `<html><head><title>Nota Thermal</title><style>${document.querySelector('style').innerHTML}</style></head><body>${thermalEl.outerHTML}</body></html>`
                            );
                        printWin.document.close();
                        printWin.focus();
                        printWin.print();
                    }
                }
            },

            shareWA(txId) {
                const tx = DB.getTransactions().find(t => t.wo === txId);
                if (!tx) { this.toast('Transaksi tidak ditemukan', 'error'); return; }
                if (!tx.customerWA) { this.toast('Nomor WA pelanggan kosong!', 'error'); return; }
                let phone = tx.customerWA.replace(/\D/g, '');
                if (phone.startsWith('0')) phone = '62' + phone.substring(1);
                if (!phone.startsWith('62')) phone = '62' + phone;
                const settings = DB.getSettings();
                const sisa = Math.max(0, tx.total - (tx.dp || 0));
                const msg =
                    `Halo Bapak/Ibu ${tx.customerName},\n\nInfo Servis dari *${settings.shopName}*:\n\nNo WO: ${tx.wo}\nStatus: *${tx.status}*\nTotal Biaya: ${Utils.rupiah(tx.total)}\nDP: ${Utils.rupiah(tx.dp || 0)}\nSisa: ${Utils.rupiah(sisa)}\n\nTerima kasih.`;
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
            }
        };

        // ================================================================
        //  6. VIEWS
        // ================================================================
        const Views = {

            dashboard() {
                const txs = DB.getTransactions();
                const today = Utils.todayStr();
                let omzetToday = 0,
                    masukToday = 0,
                    selesaiToday = 0,
                    belumSelesai = 0,
                    piutangTotal = 0;
                let totalOmzet = 0;
                txs.forEach(t => {
                    const isToday = t.date && t.date.startsWith(today);
                    const total = t.total || 0;
                    const dp = t.dp || 0;
                    const sisa = total - dp;
                    if (isToday) {
                        omzetToday += total;
                        masukToday++;
                        if (t.status === 'Selesai' || t.status === 'Sudah diambil') selesaiToday++;
                        else if (t.status !== 'Dibatalkan') belumSelesai++;
                    }
                    totalOmzet += total;
                    if (sisa > 0 && t.status !== 'Dibatalkan' && t.status !== 'Sudah diambil') {
                        piutangTotal += sisa;
                    }
                });
                const html = `
                    <div class="stat-grid">
                        <div class="stat-card"><div class="stat-label"><i class="fas fa-coins" style="color:var(--success);"></i> Omzet Hari Ini</div>
                            <div class="stat-value" style="color:var(--success);">${Utils.rupiah(omzetToday)}</div></div>
                        <div class="stat-card"><div class="stat-label"><i class="fas fa-chart-line" style="color:var(--primary);"></i> Total Omzet</div>
                            <div class="stat-value">${Utils.rupiah(totalOmzet)}</div>
                            <div class="stat-change">${txs.length} transaksi</div></div>
                        <div class="stat-card"><div class="stat-label"><i class="fas fa-tools" style="color:var(--warning);"></i> Servis Masuk</div>
                            <div class="stat-value" style="color:var(--warning);">${masukToday}</div>
                            <div class="stat-change">${selesaiToday} selesai</div></div>
                        <div class="stat-card"><div class="stat-label"><i class="fas fa-clock" style="color:var(--info);"></i> Belum Selesai</div>
                            <div class="stat-value" style="color:var(--info);">${belumSelesai}</div></div>
                        <div class="stat-card"><div class="stat-label"><i class="fas fa-hand-holding-usd" style="color:var(--danger);"></i> Piutang</div>
                            <div class="stat-value" style="color:var(--danger);">${Utils.rupiah(piutangTotal)}</div></div>
                        <div class="stat-card"><div class="stat-label"><i class="fas fa-list" style="color:var(--purple);"></i> Katalog Layanan</div>
                            <div class="stat-value">${SERVICE_CATALOG.length}</div>
                            <div class="stat-change">siap pakai</div></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><i class="fas fa-clock-rotate-left"></i> Servis Terbaru</span>
                            <button class="btn btn-sm btn-outline" onclick="App.navigate('history')">Lihat Semua</button>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead><tr><th>No WO</th><th>Pelanggan</th><th>Status</th><th>Total</th></tr></thead>
                                <tbody>
                                    ${txs.slice(-6).reverse().map(t => `
                                        <tr><td><strong>${t.wo}</strong></td><td>${t.customerName}</td><td>${Utils.getStatusBadge(t.status)}</td><td>${Utils.rupiah(t.total)}</td></tr>
                                    `).join('')}
                                    ${txs.length === 0 ? '<tr><td colspan="4" class="text-center text-muted" style="padding:2rem;">Belum ada transaksi</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                document.getElementById('view-dashboard').innerHTML = html;
            },

            pos() {
                if (!AppState.editingTxId) {
                    AppState.pos = {
                        customerName: '',
                        customerWA: '',
                        services: [],
                        discount: 0,
                        dp: 0,
                        status: 'Menunggu pemeriksaan',
                        technicianId: '',
                        warranty: 7,
                    };
                }
                const state = AppState.pos;
                const technicians = DB.getTechnicians();
                const techOpts = technicians.map(t =>
                    `<option value="${t.id}" ${t.id === state.technicianId ? 'selected' : ''}>${t.name}</option>`).join('');
                const categories = [...new Set(SERVICE_CATALOG.map(s => s.category))];
                const activeCat = AppState.activeCategory || 'HP';

                // Build service grid for active category
                const servicesInCat = SERVICE_CATALOG.filter(s => s.category === activeCat);
                const gridHtml = servicesInCat.map(s => {
                    const added = state.services.some(item => item.id === s.id);
                    return `
                        <div class="service-card" onclick="App.posAddService('${s.id}')" style="${added ? 'border-color:var(--success);' : ''}">
                            <span class="name">${s.name}</span>
                            <span class="price">${Utils.rupiah(s.price)}</span>
                            <span class="cat-label">${s.category}</span>
                            ${added ? '<span class="added-badge">✓</span>' : ''}
                        </div>
                    `;
                }).join('');

                const html = `
                    <div class="pos-wrap">
                        <div>
                            <!-- Customer -->
                            <div class="card mb-4">
                                <div class="card-header"><span class="card-title"><i class="fas fa-user"></i> Pelanggan</span>
                                    <button class="btn btn-sm btn-outline" onclick="App.posSelectCustomer()"><i class="fas fa-search"></i> Cari</button>
                                </div>
                                <div class="form-row">
                                    <div class="form-group"><label>Nama <span class="required">*</span></label>
                                        <input class="form-control" id="pos-cust-name" value="${state.customerName}" placeholder="Nama..." onchange="App.posUpdateField('customerName', this.value)"></div>
                                    <div class="form-group"><label>WhatsApp</label>
                                        <input class="form-control" id="pos-cust-wa" value="${state.customerWA}" placeholder="08..." onchange="App.posUpdateField('customerWA', this.value)"></div>
                                </div>
                            </div>

                            <!-- Catalog -->
                            <div class="card mb-4">
                                <div class="card-header">
                                    <span class="card-title"><i class="fas fa-list"></i> Pilih Layanan</span>
                                    <span class="text-sm text-muted" id="pos-count">0 item</span>
                                </div>
                                <div class="cat-tabs">
                                    ${categories.map(c => `
                                        <button class="cat-tab ${c === activeCat ? 'active' : ''}" onclick="App.posSetCategory('${c}')">${c}</button>
                                    `).join('')}
                                </div>
                                <div class="service-grid" id="service-grid">
                                    ${gridHtml || '<div class="empty-state">Tidak ada layanan untuk kategori ini</div>'}
                                </div>
                            </div>

                            <!-- Selected -->
                            <div class="card mb-4">
                                <div class="card-header">
                                    <span class="card-title"><i class="fas fa-cart-plus"></i> Item Dipilih</span>
                                    ${state.services.length > 0 ? `<button class="btn btn-sm btn-danger" onclick="App.posClearAll()">Kosongkan</button>` : ''}
                                </div>
                                <div id="pos-selected-list" class="item-list"></div>
                            </div>
                        </div>

                        <!-- Right: Summary -->
                        <div>
                            <div class="card sticky-side">
                                <div class="card-header"><span class="card-title"><i class="fas fa-calculator"></i> Ringkasan</span></div>
                                <div class="payment-summary">
                                    <div class="row"><span>Total</span><span id="pos-sum-total">Rp 0</span></div>
                                    <div class="row"><span>Diskon</span><span id="pos-sum-discount">Rp 0</span></div>
                                    <div class="row total"><span>TOTAL</span><span id="pos-sum-grand" style="color:var(--primary);">Rp 0</span></div>
                                </div>
                                <div class="divider"></div>
                                <div class="form-group">
                                    <label>Diskon (Rp)</label>
                                    <input class="form-control" type="number" id="pos-discount" value="${state.discount}" onchange="App.posUpdateField('discount', parseFloat(this.value)||0)" min="0">
                                </div>
                                <div class="form-group">
                                    <label>DP / Pembayaran Awal (Rp)</label>
                                    <input class="form-control" type="number" id="pos-dp" value="${state.dp}" onchange="App.posUpdateField('dp', parseFloat(this.value)||0)" min="0">
                                </div>
                                <div class="row" style="font-weight:600;font-size:0.95rem;margin:0.2rem 0 0.4rem;">
                                    <span>Sisa</span>
                                    <span id="pos-sum-sisa" style="color:var(--danger);">Rp 0</span>
                                </div>
                                <div class="divider"></div>
                                <div class="form-row">
                                    <div class="form-group"><label>Status</label>
                                        <select class="form-control" id="pos-status" onchange="App.posUpdateField('status', this.value)">
                                            ${['Menunggu pemeriksaan','Sedang diperiksa','Menunggu persetujuan','Menunggu sparepart','Sedang dikerjakan','Selesai','Sudah diambil','Dibatalkan'].map(s =>
                                                `<option value="${s}" ${s === state.status ? 'selected' : ''}>${s}</option>`
                                            ).join('')}
                                        </select>
                                    </div>
                                    <div class="form-group"><label>Teknisi</label>
                                        <select class="form-control" id="pos-tech" onchange="App.posUpdateField('technicianId', this.value)">
                                            <option value="">Pilih</option>
                                            ${techOpts}
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group"><label>Garansi (hari)</label>
                                    <input class="form-control" type="number" id="pos-warranty" value="${state.warranty}" onchange="App.posUpdateField('warranty', parseFloat(this.value)||0)" min="0">
                                </div>
                                ${AppState.editingTxId ? `
                                    <button class="btn btn-warning btn-block mt-3" onclick="App.posUpdateTransaction()"><i class="fas fa-save"></i> Update</button>
                                    <button class="btn btn-outline btn-block mt-2" onclick="App.posCancelEdit()">Batal</button>
                                ` : `
                                    <button class="btn btn-success btn-block mt-3" onclick="App.posSaveTransaction()"><i class="fas fa-save"></i> Simpan & Cetak Nota</button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('view-pos').innerHTML = html;
                UI.renderPOSItems();
            },

            history() {
                const txs = DB.getTransactions().reverse();
                let html = `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><i class="fas fa-list-check"></i> Data Servis</span>
                            <div class="search-box">
                                <input class="form-control" style="padding-left:2.2rem;width:200px;" placeholder="Cari..." oninput="App.searchHistory(this.value)">
                            </div>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead><tr><th>No WO</th><th>Tanggal</th><th>Pelanggan</th><th>Status</th><th>Total</th><th>Aksi</th></tr></thead>
                                <tbody id="history-tbody">
                                    ${Views._historyRows(txs)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                document.getElementById('view-history').innerHTML = html;
                window._historyData = txs;
            },

            _historyRows(txs) {
                if (!txs || txs.length === 0) {
                    return `<tr><td colspan="6" class="text-center text-muted" style="padding:2rem;">Belum ada data servis</td></tr>`;
                }
                return txs.map(t => `
                    <tr>
                        <td><strong>${t.wo}</strong></td>
                        <td>${Utils.formatDateShort(t.date)}</td>
                        <td>${t.customerName}</td>
                        <td>${Utils.getStatusBadge(t.status)}</td>
                        <td>${Utils.rupiah(t.total)}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="App.viewReceipt('${t.wo}')"><i class="fas fa-print"></i></button>
                            <button class="btn btn-sm btn-outline" onclick="App.editTransaction('${t.wo}')"><i class="fas fa-pen"></i></button>
                        </td>
                    </tr>
                `).join('');
            },

            customers() {
                const customers = DB.getCustomers();
                let html = `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><i class="fas fa-users"></i> Pelanggan</span>
                            <button class="btn btn-sm btn-primary" onclick="App.customerAdd()"><i class="fas fa-plus"></i> Tambah</button>
                        </div>
                        <div class="search-box mb-3">
                            <input class="form-control" style="padding-left:2.2rem;" placeholder="Cari pelanggan..." oninput="App.searchCustomers(this.value)">
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead><tr><th>Nama</th><th>WA</th><th>Servis</th><th>Aksi</th></tr></thead>
                                <tbody id="customers-tbody">
                                    ${customers.map(c => `
                                        <tr><td><strong>${c.name}</strong></td><td>${c.phone || '-'}</td><td>${c.serviceCount || 0}</td>
                                            <td><button class="btn btn-sm btn-outline" onclick="App.viewCustomer('${c.id}')"><i class="fas fa-eye"></i></button>
                                            <button class="btn btn-sm btn-danger" onclick="App.deleteCustomer('${c.id}')"><i class="fas fa-trash"></i></button></td></tr>
                                    `).join('')}
                                    ${customers.length === 0 ? '<tr><td colspan="4" class="text-center text-muted" style="padding:1.5rem;">Belum ada pelanggan</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                document.getElementById('view-customers').innerHTML = html;
            },

            reports() {
                const txs = DB.getTransactions();
                const totalOmzet = txs.reduce((s, t) => s + (t.total || 0), 0);
                const statusCount = {};
                txs.forEach(t => { statusCount[t.status] = (statusCount[t.status] || 0) + 1; });
                const days = [];
                const omzetData = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const ds = d.toISOString().split('T')[0];
                    days.push(d.toLocaleDateString('id-ID', { weekday: 'short' }));
                    const dayTxs = txs.filter(t => t.date && t.date.startsWith(ds));
                    omzetData.push(dayTxs.reduce((s, t) => s + (t.total || 0), 0));
                }
                const html = `
                    <div class="stat-grid">
                        <div class="stat-card"><div class="stat-label">Total Omzet</div><div class="stat-value">${Utils.rupiah(totalOmzet)}</div></div>
                        <div class="stat-card"><div class="stat-label">Total Transaksi</div><div class="stat-value">${txs.length}</div></div>
                    </div>
                    <div class="card mb-4">
                        <div class="card-header"><span class="card-title"><i class="fas fa-chart-bar"></i> Omzet 7 Hari</span></div>
                        <div class="chart-container"><canvas id="chart-omzet"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title"><i class="fas fa-chart-pie"></i> Status Servis</span></div>
                        <div style="display:flex;flex-wrap:wrap;gap:0.5rem;padding:0.3rem 0;">
                            ${Object.entries(statusCount).map(([s, c]) => `<span class="chip">${s}: <strong>${c}</strong></span>`).join('')}
                            ${Object.keys(statusCount).length === 0 ? '<span class="text-muted">Belum ada data</span>' : ''}
                        </div>
                        <div class="chart-container mt-3"><canvas id="chart-status"></canvas></div>
                    </div>
                `;
                document.getElementById('view-reports').innerHTML = html;
                setTimeout(() => {
                    const ctx1 = document.getElementById('chart-omzet');
                    if (ctx1) {
                        new Chart(ctx1, {
                            type: 'line',
                            data: {
                                labels: days,
                                datasets: [{ label: 'Omzet', data: omzetData, borderColor: '#0f3b5e',
                                    backgroundColor: 'rgba(15,59,94,0.1)', fill: true, tension: 0.3 }]
                            },
                            options: { responsive: true, maintainAspectRatio: false,
                                plugins: { legend: { position: 'top', labels: { boxWidth: 12,
                                            fontSize: 11 } } },
                                scales: { y: { beginAtZero: true, ticks: { callback: v => Utils.rupiah(
                                            v) } } } }
                        });
                    }
                    const ctx2 = document.getElementById('chart-status');
                    if (ctx2) {
                        new Chart(ctx2, {
                            type: 'doughnut',
                            data: {
                                labels: Object.keys(statusCount),
                                datasets: [{ data: Object.values(statusCount), backgroundColor: [
                                        '#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899', '#3b82f6',
                                        '#10b981', '#94a3b8', '#ef4444'
                                    ] }]
                            },
                            options: { responsive: true, maintainAspectRatio: false,
                                plugins: { legend: { position: 'right', labels: { boxWidth: 12,
                                            fontSize: 11 } } } }
                        });
                    }
                }, 200);
            },

            settings() {
                const s = DB.getSettings();
                const html = `
                    <div class="card">
                        <div class="card-header"><span class="card-title"><i class="fas fa-gear"></i> Pengaturan Toko</span></div>
                        <form onsubmit="App.saveSettings(event)">
                            <div class="form-group"><label>Nama Usaha</label><input class="form-control" name="shopName" value="${s.shopName || ''}"></div>
                            <div class="form-group"><label>Nomor WhatsApp</label><input class="form-control" name="phone" value="${s.phone || ''}"></div>
                            <div class="form-group"><label>Alamat</label><input class="form-control" name="address" value="${s.address || ''}"></div>
                            <div class="form-group"><label>Tagline</label><input class="form-control" name="tagline" value="${s.tagline || ''}"></div>
                            <div class="form-group"><label>Footer Nota</label><textarea class="form-control" name="receiptFooter" rows="3">${s.receiptFooter || ''}</textarea></div>
                            <div class="form-row">
                                <div class="form-group"><label>Garansi Default (hari)</label><input class="form-control" type="number" name="defaultWarranty" value="${s.defaultWarranty || 7}"></div>
                                <div class="form-group"><label>Format No WO</label><input class="form-control" name="woFormat" value="${s.woFormat || 'MS-{date}-{seq}'}"></div>
                            </div>
                            <button class="btn btn-primary btn-block mt-3">Simpan</button>
                        </form>
                    </div>
                `;
                document.getElementById('view-settings').innerHTML = html;
            },

            backup() {
                const html = `
                    <div class="card mb-4">
                        <div class="card-header"><span class="card-title"><i class="fas fa-download"></i> Backup Data</span></div>
                        <p class="text-muted text-sm mb-3">Ekspor semua data ke file JSON.</p>
                        <button class="btn btn-primary" onclick="App.exportData()"><i class="fas fa-file-export"></i> Ekspor JSON</button>
                    </div>
                    <div class="card mb-4">
                        <div class="card-header"><span class="card-title"><i class="fas fa-upload"></i> Restore Data</span></div>
                        <p class="text-muted text-sm mb-3">Pilih file JSON hasil backup.</p>
                        <input type="file" id="restore-file" accept=".json" style="margin-bottom:0.5rem;">
                        <button class="btn btn-success" onclick="App.importData()"><i class="fas fa-file-import"></i> Restore</button>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title" style="color:var(--danger);"><i class="fas fa-trash"></i> Reset Semua Data</span></div>
                        <p class="text-muted text-sm mb-3">⚠️ Menghapus semua data secara permanen.</p>
                        <button class="btn btn-danger" onclick="App.resetAllData()"><i class="fas fa-radiation"></i> Reset</button>
                    </div>
                `;
                document.getElementById('view-backup').innerHTML = html;
            }
        };

        // ================================================================
        //  7. APP CONTROLLER
        // ================================================================
        const App = {

            init() {
                DB.init();
                UI.updateHeader();
                document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        const view = this.dataset.view;
                        if (view) App.navigate(view);
                    });
                });
                App.navigate('dashboard');
                window.addEventListener('resize', () => {
                    if (window.innerWidth > 768) {
                        document.getElementById('sidebar').classList.remove('open');
                        document.getElementById('sidebar-overlay').classList.remove('open');
                    }
                });
            },

            navigate(view) { UI.navigate(view); },
            toggleSidebar(open) {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                if (typeof open === 'boolean') {
                    sidebar.classList.toggle('open', open);
                    overlay.classList.toggle('open', open);
                } else {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('open');
                }
            },
            closeModal() { UI.closeModal(); },
            toast(msg, type) { UI.toast(msg, type); },

            // ---- POS ----
            posUpdateField(field, value) {
                AppState.pos[field] = value;
                if (field === 'discount' || field === 'dp') UI.updatePOSSummary();
            },

            posSetCategory(cat) {
                AppState.activeCategory = cat;
                Views.pos();
            },

            posAddService(id) {
                const service = SERVICE_CATALOG.find(s => s.id === id);
                if (!service) return;
                const state = AppState.pos;
                // Check if already added
                if (state.services.some(s => s.id === id)) {
                    // Remove if already added (toggle)
                    state.services = state.services.filter(s => s.id !== id);
                    UI.renderPOSItems();
                    UI.toast('Dihapus: ' + service.name, 'info');
                    return;
                }
                state.services.push({
                    id: service.id,
                    name: service.name,
                    price: service.price,
                    category: service.category
                });
                UI.renderPOSItems();
                UI.toast('Ditambahkan: ' + service.name);
            },

            posRemoveService(index) {
                AppState.pos.services.splice(index, 1);
                UI.renderPOSItems();
            },

            posClearAll() {
                if (AppState.pos.services.length === 0) return;
                if (confirm('Kosongkan semua layanan yang dipilih?')) {
                    AppState.pos.services = [];
                    UI.renderPOSItems();
                    Views.pos();
                }
            },

            posSelectCustomer() {
                const customers = DB.getCustomers();
                if (customers.length === 0) { UI.toast('Belum ada pelanggan', 'warning'); return; }
                let opts = customers.map(c => `<option value="${c.id}">${c.name} - ${c.phone || ''}</option>`).join('');
                const html =
                    `<div class="form-group"><label>Pilih Pelanggan</label><select class="form-control" id="modal-cust-select">${opts}</select></div>`;
                const footer =
                    `<button class="btn btn-outline" onclick="App.closeModal()">Batal</button><button class="btn btn-primary" onclick="App.posApplyCustomer()">Pilih</button>`;
                UI.openModal('Pilih Pelanggan', html, footer);
            },

            posApplyCustomer() {
                const id = document.getElementById('modal-cust-select').value;
                const cust = DB.getCustomers().find(c => c.id === id);
                if (cust) {
                    AppState.pos.customerName = cust.name;
                    AppState.pos.customerWA = cust.phone || '';
                    Views.pos();
                    UI.toast('Pelanggan: ' + cust.name);
                }
                App.closeModal();
            },

            posSaveTransaction() {
                const state = AppState.pos;
                if (!state.customerName.trim()) { UI.toast('Nama pelanggan wajib diisi', 'error'); return; }
                if (state.services.length === 0) { UI.toast('Pilih minimal 1 layanan', 'error'); return; }
                const total = state.services.reduce((s, i) => s + i.price, 0);
                const discount = state.discount || 0;
                const grandTotal = total - discount;
                if (grandTotal <= 0) { UI.toast('Total harus lebih dari 0', 'error'); return; }
                const dp = state.dp || 0;
                if (dp > grandTotal) { UI.toast('DP tidak boleh lebih dari total', 'error'); return; }

                const wo = DB.generateWO();
                const tech = DB.getTechnicians().find(t => t.id === state.technicianId);
                const tx = {
                    wo: wo,
                    date: new Date().toISOString(),
                    customerName: state.customerName,
                    customerWA: state.customerWA,
                    customerId: null,
                    services: state.services.map(s => ({ name: s.name, price: s.price, category: s.category })),
                    discount: discount,
                    total: grandTotal,
                    dp: dp,
                    status: state.status,
                    technicianId: state.technicianId || null,
                    technician: tech ? tech.name : '',
                    warranty: state.warranty || 0,
                };

                // Update customer
                let customers = DB.getCustomers();
                const existing = customers.find(c => c.name.toLowerCase() === state.customerName.toLowerCase());
                if (existing) {
                    existing.serviceCount = (existing.serviceCount || 0) + 1;
                    existing.lastService = tx.date;
                    existing.totalSpent = (existing.totalSpent || 0) + grandTotal;
                    tx.customerId = existing.id;
                } else {
                    const newCust = {
                        id: Utils.genId('CUST'),
                        name: state.customerName,
                        phone: state.customerWA,
                        serviceCount: 1,
                        totalSpent: grandTotal,
                        lastService: tx.date
                    };
                    customers.push(newCust);
                    tx.customerId = newCust.id;
                }
                DB.setCustomers(customers);

                // Update technician
                if (state.technicianId) {
                    const techs = DB.getTechnicians();
                    const tIdx = techs.findIndex(t => t.id === state.technicianId);
                    if (tIdx !== -1) {
                        techs[tIdx].servicesCount = (techs[tIdx].servicesCount || 0) + 1;
                        DB.setTechnicians(techs);
                    }
                }

                // Save
                const txs = DB.getTransactions();
                txs.push(tx);
                DB.setTransactions(txs);

                UI.toast('Servis ' + wo + ' berhasil!');
                AppState.pos = {
                    customerName: '',
                    customerWA: '',
                    services: [],
                    discount: 0,
                    dp: 0,
                    status: 'Menunggu pemeriksaan',
                    technicianId: '',
                    warranty: 7,
                };
                AppState.editingTxId = null;
                App.navigate('history');
                setTimeout(() => UI.showReceipt(wo), 500);
            },

            editTransaction(wo) {
                const tx = DB.getTransactions().find(t => t.wo === wo);
                if (!tx) { UI.toast('Transaksi tidak ditemukan', 'error'); return; }
                AppState.editingTxId = wo;
                AppState.pos = {
                    customerName: tx.customerName || '',
                    customerWA: tx.customerWA || '',
                    services: (tx.services || []).map(s => ({
                        id: 'E' + Date.now() + Math.random(),
                        name: s.name,
                        price: s.price,
                        category: s.category || 'Umum'
                    })),
                    discount: tx.discount || 0,
                    dp: tx.dp || 0,
                    status: tx.status || 'Menunggu pemeriksaan',
                    technicianId: tx.technicianId || '',
                    warranty: tx.warranty || 0,
                };
                App.navigate('pos');
                UI.toast('Edit: ' + wo);
            },

            posUpdateTransaction() {
                const state = AppState.pos;
                const wo = AppState.editingTxId;
                if (!wo) { UI.toast('Tidak ada transaksi diedit', 'error'); return; }
                const txs = DB.getTransactions();
                const idx = txs.findIndex(t => t.wo === wo);
                if (idx === -1) { UI.toast('Transaksi tidak ditemukan', 'error'); return; }
                const total = state.services.reduce((s, i) => s + i.price, 0);
                const discount = state.discount || 0;
                const grandTotal = total - discount;
                if (grandTotal <= 0) { UI.toast('Total harus lebih dari 0', 'error'); return; }
                const tech = DB.getTechnicians().find(t => t.id === state.technicianId);
                txs[idx] = {
                    ...txs[idx],
                    customerName: state.customerName,
                    customerWA: state.customerWA,
                    services: state.services.map(s => ({ name: s.name, price: s.price, category: s.category || 'Umum' })),
                    discount: discount,
                    total: grandTotal,
                    dp: state.dp || 0,
                    status: state.status,
                    technicianId: state.technicianId || null,
                    technician: tech ? tech.name : '',
                    warranty: state.warranty || 0,
                };
                DB.setTransactions(txs);
                UI.toast('Servis ' + wo + ' diupdate!');
                AppState.editingTxId = null;
                App.navigate('history');
                setTimeout(() => UI.showReceipt(wo), 500);
            },

            posCancelEdit() {
                AppState.editingTxId = null;
                AppState.pos = {
                    customerName: '',
                    customerWA: '',
                    services: [],
                    discount: 0,
                    dp: 0,
                    status: 'Menunggu pemeriksaan',
                    technicianId: '',
                    warranty: 7,
                };
                App.navigate('pos');
                UI.toast('Edit dibatalkan');
            },

            // ---- History ----
            searchHistory(query) {
                const txs = window._historyData || DB.getTransactions().reverse();
                const filtered = Utils.filterList(txs, query, ['wo', 'customerName', 'status']);
                document.getElementById('history-tbody').innerHTML = Views._historyRows(filtered);
            },

            viewReceipt(wo) { UI.showReceipt(wo); },
            shareWA(wo) { UI.shareWA(wo); },
            printReceipt(mode) { UI.printReceipt(mode); },

            // ---- Customers ----
            customerAdd() {
                const html =
                    `
                    <div class="form-group"><label>Nama <span class="required">*</span></label><input class="form-control" id="cust-name" placeholder="Nama..."></div>
                    <div class="form-group"><label>WhatsApp</label><input class="form-control" id="cust-phone" placeholder="08..."></div>`;
                const footer =
                    `<button class="btn btn-outline" onclick="App.closeModal()">Batal</button><button class="btn btn-primary" onclick="App.customerSave()">Simpan</button>`;
                UI.openModal('Tambah Pelanggan', html, footer);
            },

            customerSave() {
                const name = document.getElementById('cust-name').value.trim();
                if (!name) { UI.toast('Nama wajib diisi', 'error'); return; }
                const customers = DB.getCustomers();
                customers.push({
                    id: Utils.genId('CUST'),
                    name: name,
                    phone: document.getElementById('cust-phone').value.trim(),
                    serviceCount: 0,
                    totalSpent: 0,
                    lastService: null
                });
                DB.setCustomers(customers);
                UI.toast('Pelanggan ditambahkan');
                App.closeModal();
                Views.customers();
            },

            searchCustomers(query) {
                const customers = DB.getCustomers();
                const filtered = Utils.filterList(customers, query, ['name', 'phone']);
                const tbody = document.getElementById('customers-tbody');
                if (tbody) {
                    tbody.innerHTML = filtered.map(c =>
                        `
                        <tr><td><strong>${c.name}</strong></td><td>${c.phone || '-'}</td><td>${c.serviceCount || 0}</td>
                            <td><button class="btn btn-sm btn-outline" onclick="App.viewCustomer('${c.id}')"><i class="fas fa-eye"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="App.deleteCustomer('${c.id}')"><i class="fas fa-trash"></i></button></td></tr>`
                    ).join('') || '<tr><td colspan="4" class="text-center text-muted" style="padding:1.5rem;">Tidak ditemukan</td></tr>';
                }
            },

            viewCustomer(id) {
                const cust = DB.getCustomers().find(c => c.id === id);
                if (!cust) { UI.toast('Pelanggan tidak ditemukan', 'error'); return; }
                const txs = DB.getTransactions().filter(t => t.customerId === id || t.customerName === cust.name);
                const html =
                    `
                    <div><strong>Nama:</strong> ${cust.name}</div>
                    <div><strong>WA:</strong> ${cust.phone || '-'}</div>
                    <div><strong>Servis:</strong> ${cust.serviceCount || 0}</div>
                    <div><strong>Total Belanja:</strong> ${Utils.rupiah(cust.totalSpent || 0)}</div>
                    <div class="divider"></div>
                    <div><strong>Riwayat:</strong></div>
                    ${txs.map(t => `<div style="padding:0.2rem 0;border-bottom:1px solid var(--gray-100);">${t.wo} - ${Utils.rupiah(t.total)} <span class="badge ${t.status === 'Selesai' ? 'badge-success' : 'badge-warning'}">${t.status}</span></div>`).join('') || '<div class="text-muted">Belum ada servis</div>'}
                `;
                UI.openModal('Detail Pelanggan', html, '');
            },

            deleteCustomer(id) {
                if (!confirm('Hapus pelanggan ini?')) return;
                let customers = DB.getCustomers();
                customers = customers.filter(c => c.id !== id);
                DB.setCustomers(customers);
                UI.toast('Pelanggan dihapus');
                Views.customers();
            },

            // ---- Settings ----
            saveSettings(e) {
                e.preventDefault();
                const form = e.target;
                const data = {
                    shopName: form.shopName.value,
                    phone: form.phone.value,
                    address: form.address.value,
                    tagline: form.tagline.value,
                    receiptFooter: form.receiptFooter.value,
                    defaultWarranty: parseInt(form.defaultWarranty.value) || 7,
                    woFormat: form.woFormat.value || 'MS-{date}-{seq}',
                };
                DB.setSettings(data);
                UI.updateHeader();
                UI.toast('Pengaturan disimpan!');
            },

            // ---- Backup ----
            exportData() {
                const data = {
                    customers: DB.getCustomers(),
                    technicians: DB.getTechnicians(),
                    transactions: DB.getTransactions(),
                    settings: DB.getSettings(),
                    exportedAt: new Date().toISOString(),
                    version: '3.1'
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `malik-backup-${Utils.todayStr()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                UI.toast('Data diekspor!');
            },

            importData() {
                const fileInput = document.getElementById('restore-file');
                if (!fileInput.files || fileInput.files.length === 0) {
                    UI.toast('Pilih file JSON', 'warning');
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.customers || !data.transactions) {
                            UI.toast('Format tidak valid', 'error');
                            return;
                        }
                        if (!confirm('Restore akan mengganti semua data. Lanjutkan?')) return;
                        DB.setCustomers(data.customers || []);
                        DB.setTechnicians(data.technicians || []);
                        DB.setTransactions(data.transactions || []);
                        if (data.settings) DB.setSettings(data.settings);
                        UI.toast('Data direstore!');
                        App.navigate('dashboard');
                    } catch (err) {
                        UI.toast('Gagal: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            },

            resetAllData() {
                if (!confirm('⚠️ Hapus SEMUA data? Konfirmasi lagi.')) return;
                if (!confirm('Yakin? Data tidak bisa dikembalikan.')) return;
                localStorage.clear();
                DB.init();
                UI.toast('Data direset!');
                window.location.reload();
            }
        };

        // ================================================================
        //  8. BOOTSTRAP
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
        window.App = App;
        window.UI = UI;
        window.Utils = Utils;
        window.DB = DB;
        window.Views = Views;
        window.SERVICE_CATALOG = SERVICE_CATALOG;
    </script>
</body>
</html>
